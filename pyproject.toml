[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-harness"
version = "0.1.13"
description = "The simplest, thinnest, and most powerful harness to control your real browser with your agent."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "automation", "browser", "cdp", "chrome", "scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "cdp-use==1.4.5",
    "fetch-use==0.4.0",
    "pillow==12.3.0",
    "websockets==15.0.1",
    # ironerumi fork: browser_use.ax (bu.state()/click(id)/type(id, text)) runs on this daemon.
    # browser-use pins browser-harness to an exact version: an upstream version bump fails to
    # resolve until browser-use releases against it.
    "browser-use==1.0.5",
]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]  # ironerumi fork: browser-use 1.0.5 pins mcp==2.3.0

[project.scripts]
browser-harness = "browser_harness.run:main"
browser-harness-mcp = "browser_harness.mcp_cli:main"

[project.urls]
Homepage = "https://github.com/browser-use/browser-harness"
Repository = "https://github.com/browser-use/browser-harness"
Issues = "https://github.com/browser-use/browser-harness/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["mcp_server"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
browser_harness = ["SKILL.md", "video-template.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
